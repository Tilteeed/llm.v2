---
# ============================================================
# tasks/main.yml
# Роль: rag_agent
# ============================================================

- name: Validate Docker CLI before RAG agent deployment
  ansible.builtin.command:
    argv:
      - docker
      - version
  register: rag_agent_docker_version_check
  changed_when: false
  tags:
    - rag_agent
    - validation
    - prereq

- name: Validate Docker daemon before RAG agent deployment
  ansible.builtin.command:
    argv:
      - docker
      - info
  register: rag_agent_docker_info_check
  changed_when: false
  tags:
    - rag_agent
    - validation
    - prereq

- name: Ensure git is installed (required to clone RAG repo)
  ansible.builtin.apt:
    name: git
    state: present
    update_cache: false
  tags:
    - rag_agent
    - prereq

- name: Ensure RAG agent base directory exists
  ansible.builtin.file:
    path: "{{ rag_agent_base_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - rag_agent
    - filesystem

- name: Ensure RAG agent compose directory exists
  ansible.builtin.file:
    path: "{{ rag_agent_compose_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - rag_agent
    - filesystem

- name: Ensure RAG agent data directory exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ rag_agent_data_dir }}"
    - "{{ rag_agent_data_dir }}/documents"
    - "{{ rag_agent_data_dir }}/indexes"
  tags:
    - rag_agent
    - filesystem
    - data

- name: Clone RAG agent repository
  ansible.builtin.git:
    repo: "{{ rag_agent_repo_url }}"
    dest: "{{ rag_agent_src_dir }}"
    version: "{{ rag_agent_repo_version }}"
    update: true
    force: true
  register: rag_agent_repo_clone
  tags:
    - rag_agent
    - source

- name: Strip UTF-8 BOM from RAG Dockerfile if present
  ansible.builtin.shell: |
    sed -i '1s/^\xEF\xBB\xBF//' {{ rag_agent_src_dir }}/Dockerfile
  changed_when: false
  tags:
    - rag_agent
    - source

# ------------------------------------------------------------
# Langfuse overlay.
# Накладываем патч на исходники RAG-agent после git clone
# и до docker build.
# ------------------------------------------------------------

- name: Copy Langfuse observability helper into RAG source
  ansible.builtin.copy:
    src: observability.py
    dest: "{{ rag_agent_src_dir }}/src/rag_agent/core/observability.py"
    owner: root
    group: root
    mode: "0644"
  when: rag_agent_langfuse_enable | bool
  tags:
    - rag_agent
    - langfuse
    - observability

- name: Add langfuse dependency to pyproject.toml
  ansible.builtin.lineinfile:
    path: "{{ rag_agent_src_dir }}/pyproject.toml"
    insertafter: '^\s*"python-multipart",'
    line: '    "langfuse>=3,<4",'
    state: present
  when: rag_agent_langfuse_enable | bool
  tags:
    - rag_agent
    - langfuse
    - observability

- name: Import langchain_config in main_agent.py
  ansible.builtin.lineinfile:
    path: "{{ rag_agent_src_dir }}/src/rag_agent/agents/main_agent.py"
    insertafter: '^from \.\.core\.config import get_settings'
    line: 'from ..core.observability import langchain_config'
    state: present
  when: rag_agent_langfuse_enable | bool
  tags:
    - rag_agent
    - langfuse
    - observability

- name: Pass Langfuse callbacks into LangGraph ainvoke
  ansible.builtin.shell: |
    python3 - <<'PY'
    from pathlib import Path

    path = Path("{{ rag_agent_src_dir }}/src/rag_agent/agents/main_agent.py")
    text = path.read_text(encoding="utf-8")

    old = "            result = await self.graph.ainvoke(inputs)"

    new = """            result = await self.graph.ainvoke(
                inputs,
                config=langchain_config(
                    session_id=thread_id,
                    tags=["rag-agent", "agent-chat"],
                    metadata={"endpoint": "agent-chat"},
                ),
            )"""

    if new in text:
        print("already patched")
    elif old in text:
        path.write_text(text.replace(old, new), encoding="utf-8")
        print("patched")
    else:
        raise SystemExit("target line not found in main_agent.py")
    PY
  register: rag_agent_langfuse_ainvoke_patch
  changed_when: "rag_agent_langfuse_ainvoke_patch.stdout.strip() == 'patched'"
  when: rag_agent_langfuse_enable | bool
  tags:
    - rag_agent
    - langfuse
    - observability

- name: Instrument direct RAG chat endpoint with Langfuse
  ansible.builtin.shell: |
    python3 - <<'PY'
    from pathlib import Path

    path = Path("{{ rag_agent_src_dir }}/src/rag_agent/main.py")
    text = path.read_text(encoding="utf-8")
    changed = False

    # 1. Добавляем импорт observability helper.
    import_anchor = "from .core.config import get_settings"
    import_line = "from .core.observability import observe, update_trace, langfuse_observation"

    if import_line not in text:
        if import_anchor not in text:
            raise SystemExit("import anchor not found in main.py")
        text = text.replace(import_anchor, import_anchor + "\n" + import_line)
        changed = True

    # 2. Добавляем @observe над _guarded_rag_chat.
    func_def = "async def _guarded_rag_chat(request: RAGChatRequest):"
    decorated_func_def = (
        '@observe(name="rag-chat")\n'
        "async def _guarded_rag_chat(request: RAGChatRequest):"
    )

    if decorated_func_def not in text:
        if func_def not in text:
            raise SystemExit("_guarded_rag_chat function definition not found")
        text = text.replace(func_def, decorated_func_def)
        changed = True

    # 3. В начало _guarded_rag_chat добавляем update_trace.
    old_start = (
        '@observe(name="rag-chat")\n'
        "async def _guarded_rag_chat(request: RAGChatRequest):\n"
        "    blocked = await _check_input_guardrail(request.message)"
    )

    new_start = (
        '@observe(name="rag-chat")\n'
        "async def _guarded_rag_chat(request: RAGChatRequest):\n"
        "    update_trace(\n"
        '        name="rag-chat",\n'
        "        session_id=request.thread_id,\n"
        '        tags=["rag-agent", "rag-chat"],\n'
        '        input={"message": request.message, "top_k": request.top_k},\n'
        '        metadata={"endpoint": "rag-chat"},\n'
        "    )\n"
        "\n"
        "    blocked = await _check_input_guardrail(request.message)"
    )

    if 'metadata={"endpoint": "rag-chat"}' not in text:
        if old_start not in text:
            raise SystemExit("_guarded_rag_chat start block not found")
        text = text.replace(old_start, new_start)
        changed = True

    # 4. Оборачиваем retrieval в отдельный span.
    old_retrieval = (
        "    retrieval_result = await retrieval_service.retrieve_context(\n"
        "        query=request.message,\n"
        "        top_k=request.top_k,\n"
        "    )\n"
        "    contexts = retrieval_result.contexts"
    )

    new_retrieval = (
        "    with langfuse_observation(\n"
        '        name="rag-retrieval",\n'
        '        as_type="span",\n'
        '        input={"query": request.message, "top_k": request.top_k},\n'
        '        metadata={"endpoint": "rag-chat"},\n'
        "    ) as retrieval_span:\n"
        "        retrieval_result = await retrieval_service.retrieve_context(\n"
        "            query=request.message,\n"
        "            top_k=request.top_k,\n"
        "        )\n"
        "        contexts = retrieval_result.contexts\n"
        "\n"
        "        if retrieval_span is not None:\n"
        "            retrieval_span.update(\n"
        "                output={\n"
        '                    "context_count": len(contexts),\n'
        '                    "contexts": [\n'
        "                        {\n"
        '                            "source": context.source,\n'
        '                            "chunk_id": context.chunk_id,\n'
        '                            "text_preview": context.text[:500],\n'
        "                        }\n"
        "                        for context in contexts\n"
        "                    ],\n"
        "                }\n"
        "            )"
    )

    if 'name="rag-retrieval"' not in text:
        if old_retrieval not in text:
            raise SystemExit("retrieval block not found in main.py")
        text = text.replace(old_retrieval, new_retrieval)
        changed = True

    # 5. Оборачиваем прямой вызов Ollama в generation observation.
    old_generation = "    answer = await rag_llm_service.generate(prompt)"

    new_generation = (
        "    with langfuse_observation(\n"
        '        name="rag-ollama-generate",\n'
        '        as_type="generation",\n'
        "        input=prompt,\n"
        "        model=settings.ollama_chat_model,\n"
        "        metadata={\n"
        '            "endpoint": "rag-chat",\n'
        '            "context_count": len(contexts),\n'
        "        },\n"
        "    ) as generation:\n"
        "        answer = await rag_llm_service.generate(prompt)\n"
        "\n"
        "        if generation is not None:\n"
        "            generation.update(output=answer)"
    )

    if 'name="rag-ollama-generate"' not in text:
        if old_generation not in text:
            raise SystemExit("generation block not found in main.py")
        text = text.replace(old_generation, new_generation)
        changed = True

    if changed:
        path.write_text(text, encoding="utf-8")
        print("patched")
    else:
        print("already patched")
    PY
  register: rag_agent_langfuse_rag_chat_patch
  changed_when: "rag_agent_langfuse_rag_chat_patch.stdout.strip() == 'patched'"
  when: rag_agent_langfuse_enable | bool
  tags:
    - rag_agent
    - langfuse
    - observability

- name: Check whether shared Docker network exists
  ansible.builtin.command:
    argv:
      - docker
      - network
      - inspect
      - "{{ rag_agent_network_name }}"
  register: rag_agent_network_check
  changed_when: false
  failed_when: false
  tags:
    - rag_agent
    - network

- name: Fail if shared Docker network is missing
  ansible.builtin.assert:
    that:
      - rag_agent_network_check.rc == 0
    fail_msg: >-
      Required Docker network {{ rag_agent_network_name }} was not found.
      Deploy ollama_container first or ensure the shared network exists.
    success_msg: >-
      Docker network {{ rag_agent_network_name }} exists.
  tags:
    - rag_agent
    - network
    - validation

- name: Render RAG agent docker compose file
  ansible.builtin.template:
    src: rag-agent-compose.yml.j2
    dest: "{{ rag_agent_compose_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: rag_agent_restart_stack
  tags:
    - rag_agent
    - compose

# ------------------------------------------------------------
# Сборка образа. Делаем async/poll по тому же принципу, что
# и docker pull в ollama_container — на медленной сети это
# может занять несколько минут.
# ------------------------------------------------------------
- name: Build RAG agent Docker image
  ansible.builtin.command:
    argv:
      - docker
      - build
      - -t
      - "{{ rag_agent_image_tag }}"
      - "{{ rag_agent_src_dir }}"
  register: rag_agent_build
  changed_when: >-
    'Successfully tagged' in rag_agent_build.stdout
    or 'naming to docker.io/library/' in rag_agent_build.stderr
    or 'writing image' in rag_agent_build.stderr
  async: 1800
  poll: 10
  tags:
    - rag_agent
    - deploy
    - image

- name: Show RAG agent image build result
  ansible.builtin.debug:
    var: rag_agent_build.stdout_lines
  tags:
    - rag_agent
    - deploy
    - image

- name: Start RAG agent compose stack
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ rag_agent_compose_file }}"
      - up
      - -d
  register: rag_agent_compose_up
  changed_when: >-
    'Started' in rag_agent_compose_up.stdout
    or 'Creating' in rag_agent_compose_up.stdout
    or 'Recreating' in rag_agent_compose_up.stdout
  tags:
    - rag_agent
    - compose
    - deploy

- name: Flush handlers to restart RAG stack immediately if needed
  ansible.builtin.meta: flush_handlers
  tags:
    - rag_agent
    - compose
    - deploy

- name: Inspect RAG agent container running state
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - -f
      - "{{ '{{.State.Running}}' }}"
      - "{{ rag_agent_container_name }}"
  register: rag_agent_running_state
  changed_when: false
  retries: 10
  delay: 5
  until: rag_agent_running_state.stdout == "true"
  tags:
    - rag_agent
    - validation
    - deploy

- name: Wait until RAG agent /health responds
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ rag_agent_host_port }}/health"
    method: GET
    return_content: false
    status_code: 200
    timeout: 10
  register: rag_agent_health_check
  retries: "{{ rag_agent_healthcheck_retries }}"
  delay: "{{ rag_agent_healthcheck_delay }}"
  until: rag_agent_health_check.status == 200
  changed_when: false
  tags:
    - rag_agent
    - validation
    - healthcheck

- name: Show final RAG agent deployment validation output
  ansible.builtin.debug:
    msg:
      - "RAG agent deployment completed successfully."
      - "Container name: {{ rag_agent_container_name }}"
      - "Image: {{ rag_agent_image_tag }}"
      - "Published endpoint: http://{{ rag_agent_bind_address }}:{{ rag_agent_host_port }}"
      - "Health URL: http://127.0.0.1:{{ rag_agent_host_port }}/health"
      - "Ollama backend: {{ rag_agent_ollama_base_url }}"
      - "Chat model: {{ rag_agent_chat_model }}"
      - "Embedding model: {{ rag_agent_embedding_model }}"
      - "Data directory on host: {{ rag_agent_data_dir }}"
      - ""
      - "Поменять модель: правь rag_agent_chat_model / rag_agent_embedding_model"
      - "в group_vars/all.yml (или urfu-server.yml) и прогоняй:"
      - "  ansible-playbook site.yml --tags rag_agent,ollama_pull_models"
  tags:
    - rag_agent
    - validation
